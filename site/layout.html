<!doctype html>
<html lang="{{lang}}" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anarchopoeia</title>
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('anarchopoeia-theme') === 'light' ? 'light' : 'dark'; } catch {}
</script>
<style>
:root { color-scheme: dark; --bg: #282a36; --surface: #343746; --text: #f8f8f2; --edge: #6272a4; --link: #8be9fd; --accent: #ff442e; }
:root[data-theme="light"] { color-scheme: light; --bg: #faf8f2; --surface: #f1edf7; --text: #252435; --edge: #81788d; --link: #175768; --accent: #674293; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 1.1rem/1.65 Georgia, serif; }
main { max-width: 54rem; margin: auto; padding: 1.25rem; }
header { display: grid; grid-template-columns: minmax(13rem, 1fr) minmax(0, 54rem) minmax(0, 1fr); align-items: center; }
.header-nav { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: 1.25rem; border-bottom: 1px solid var(--edge); }
@media (max-width: 58rem) { .header-nav { padding-inline-start: .5rem; } }
nav, .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
.brand { display: inline-flex; align-items: center; justify-self: center; margin: .375rem .5rem; padding: .125rem .625rem .125rem .25rem; color: #a62f39; text-decoration: none; }
:root[data-theme="dark"] .brand { color: var(--accent); }
.brand svg { display: block; width: 3.5rem; height: 3.5rem; }
.brand-name { margin-inline-start: -.125rem; font-size: 1.2rem; font-weight: 700; line-height: 1; }
@media (max-width: 43rem) {
  header { grid-template-columns: minmax(0, 1fr); }
  .brand { justify-self: start; margin-inline-start: .75rem; }
  .header-nav { padding: .75rem; }
}
.controls { margin-inline-start: auto; }
.controls > * { display: inline-grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 1px solid var(--edge); border-radius: .45rem; background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer; }
.controls svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.controls .flag { width: 1.5rem; height: 1rem; border-radius: .12rem; stroke: none; }
:root[lang="fr"] .flag-fr, :root[lang="en"] .flag-en { display: none; }
:root[data-theme="dark"] .moon, :root[data-theme="light"] .sun { display: none; }
.controls > *:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
a { color: var(--link); }
:root[data-theme="dark"] nav a { color: var(--accent); }
main { overflow-x: auto; overflow-wrap: anywhere; }
h1, h2, h3 { line-height: 1.2; }
h1, h2 { color: var(--accent); }
code, th { background: var(--surface); }
td, th { padding: .35rem .6rem; border: 1px solid var(--edge); }
table { border-collapse: collapse; }
</style>
</head>
<body>
<header>
<a class="brand" href="{{home}}" aria-label="Anarchopœia"><svg id="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="-96 -88 192 160" aria-hidden="true"><g fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M-58-4c15-51 69-68 105-36C11-56-36-39-58-4Zm109-23c31 34-4 80-50 81 33-12 60-41 50-81ZM-11 55c-43 8-69-30-46-56-9 28 11 48 46 56Z" /><path d="M-69 6c-9 18 0 34 12 42M24-59c14 2 27 9 35 19M63 22c-5 14-16 22-27 27" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" /><path d="M-48 58l4-13 4-4 9-27 3-3 11-32 3-4 13-49 4 7 3-3 4 16 5 13 5 18 3 3 12 37 4 5 10 28-6-3-5 4-4-9-4-2-10-29-3-2L3-53l-9 34-4 6-11 30-4 5-10 29-5 4-3-2ZM-86 18l10-5 14-2 9-4 17-3 22-6 19-2 16-5 28-4 8-4 25-5-6 5 8 1-11 4 4 3-30 4-18 6-23 2-15 5-18 2-16 5-15 2-13 5-10 1 5-4-5-1Z" /><path d="M-45 60l13-31M0-72l-3 16m60 39 22-5m-11 16 13-3M-89 23l17-5m-14-3 14-5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></g></svg><span class="brand-name" aria-hidden="true">narchopœia</span></a><div class="header-nav"><nav><a href="{{home}}">{{homeLabel}}</a><a href="{{manifesto}}">{{manifestoLabel}}</a><a href="{{proposals}}">Propositions</a></nav>
<div class="controls">
<button id="theme" type="button">
<svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1a9 9 0 1 0 10 10Z"/></svg>
</button>
<a href="{{languageUrl}}" id="language" aria-label="{{languageLabel}}" title="{{languageLabel}}">
<svg class="flag flag-fr" viewBox="0 0 30 20" aria-hidden="true"><path fill="#0055a4" d="M0 0h10v20H0z"/><path fill="#fff" d="M10 0h10v20H10z"/><path fill="#ef4135" d="M20 0h10v20H20z"/></svg>
<svg class="flag flag-en" viewBox="0 0 30 20" aria-hidden="true"><path fill="#012169" d="M0 0h30v20H0z"/><path style="stroke:#fff;stroke-width:4;stroke-linecap:butt" d="m0 0 30 20m0-20L0 20"/><path style="stroke:#c8102e;stroke-width:1.5;stroke-linecap:butt" d="m0 0 30 20m0-20L0 20"/><path fill="#fff" d="M0 7h30v6H0zM12 0h6v20h-6z"/><path fill="#c8102e" d="M0 8.5h30v3H0zM13.5 0h3v20h-3z"/></svg>
</a>
</div>
</div></header>
<main>{{body}}</main>
<script>
const root = document.documentElement;
const favicon = document.createElement('link');
favicon.rel = 'icon';
favicon.type = 'image/svg+xml';
const mark = document.querySelector('#brand-mark');
favicon.href = 'data:image/svg+xml,' + encodeURIComponent(new XMLSerializer().serializeToString(mark).replaceAll('currentColor', '#ff442e'));
document.head.append(favicon);
const french = root.lang === 'fr';
const themeButton = document.querySelector('#theme');
const languageButton = document.querySelector('#language');
languageButton.hreflang = french ? 'en' : 'fr';
languageButton.lang = languageButton.hreflang;
if (!french) document.querySelector('nav a:last-child').textContent = 'Proposals';
function labelTheme() {
  const label = root.dataset.theme === 'dark'
    ? (french ? 'Thème clair' : 'Light theme')
    : (french ? 'Thème sombre' : 'Dark theme');
  themeButton.setAttribute('aria-label', label);
  themeButton.title = label;
}
labelTheme();
themeButton.addEventListener('click', () => {
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('anarchopoeia-theme', root.dataset.theme); } catch {}
  labelTheme();
});
let version;
async function checkForChanges() {
  try {
    const response = await fetch('/__preview_version', { cache: 'no-store' });
    if (response.ok) {
      const latest = await response.text();
      if (version && version !== latest) { location.reload(); return; }
      version = latest;
    }
  } catch {}
  setTimeout(checkForChanges, 1000);
}
checkForChanges();
</script>
</body>
</html>
